name: IndexNow

# 部署后把 sitemap 里的全部 URL 提交给 IndexNow（Bing / Yandex / Seznam 等共用）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE: https://www.aiworkagent.org
  KEY: 3875029bdab7439d83025e91f520cabc

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment (key file reachable)
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS --max-time 15 "$SITE/$KEY.txt" || true)
            if [ "$body" = "$KEY" ]; then
              echo "Key file live."
              exit 0
            fi
            echo "attempt $i: deployment not live yet, retrying in 60s..."
            sleep 60
          done
          echo "Key file never became reachable; submitting anyway." >&2

      - name: Collect URLs from sitemap and submit
        run: |
          curl -fsS --max-time 30 "$SITE/sitemap.xml" -o sitemap.xml
          grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' > urls.txt
          count=$(wc -l < urls.txt)
          echo "Submitting $count URLs to IndexNow"
          # IndexNow 单次上限 10000 条，本站远低于此
          jq -n --rawfile urls urls.txt \
            --arg host "${SITE#https://}" \
            --arg key "$KEY" \
            --arg keyLocation "$SITE/$KEY.txt" \
            '{host: $host,
              key: $key,
              keyLocation: $keyLocation,
              urlList: ($urls | split("\n") | map(select(length > 0)))}' > payload.json
          # 200/202 = 接受；422 = 部分有效；403 多见于部署传播期 API 侧仍读到 key 文件的旧缓存，整体重试兜底
          for attempt in 1 2 3; do
            status=$(curl -sS -o response.txt -w '%{http_code}' \
              --retry 3 --retry-delay 10 \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data @payload.json \
              https://api.indexnow.org/indexnow)
            echo "attempt $attempt: HTTP $status"
            echo "Response body:"
            cat response.txt || true
            case "$status" in
              200|202|422)
                echo "IndexNow accepted (HTTP $status)."
                exit 0
                ;;
            esac
            echo "Submission not accepted (HTTP $status), retrying in 120s..." >&2
            sleep 120
          done
          echo "IndexNow submission failed after 3 attempts" >&2
          exit 1
